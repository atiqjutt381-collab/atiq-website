<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Samundri Market - Faisalabad</title><style>*{margin:0;padding:0;box-sizing:border-box;font-family:Roboto,Arial}header{background:#002f34;color:#fff;padding:12px 20px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:100}.logo{font-size:26px;font-weight:900}.logo span{color:#23e5db}.sell-btn{background:#fff;color:#002f34;padding:8px 22px;border-radius:30px;font-weight:700;border:4px solid #23e5db;cursor:pointer}.container{max-width:1280px;margin:15px auto;padding:0 15px;display:grid;grid-template-columns:1fr 320px;gap:20px}.filters{background:#fff;border:1px solid #ddd;border-radius:8px;padding:15px;margin-bottom:15px}.ads-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:15px}.card{border:1px solid #ddd;border-radius:8px;overflow:hidden;background:#fff;cursor:pointer}.card img{width:100%;height:170px;object-fit:cover}.card-body{padding:10px}.price{font-weight:800}.title{font-size:14px;height:36px;overflow:hidden}.loc{font-size:11px;color:#888}.heart{float:right;color:#ccc}.heart.fav{color:red}.detail,.sell-modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:200;overflow:auto;padding:20px}.detail-inner{max-width:900px;margin:auto;background:#fff;border-radius:10px;display:grid;grid-template-columns:1fr 330px}.sell-box{max-width:600px;margin:auto;background:#fff;border-radius:10px;padding:20px}.sell-box input,.sell-box select,.sell-box textarea{width:100%;padding:10px;margin:7px 0;border:1px solid #ccc;border-radius:6px}.pic-box{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.pic-box div{border:2px dashed #ccc;height:75px;display:flex;align-items:center;justify-content:center;border-radius:8px;overflow:hidden;cursor:pointer}.pic-box img{width:100%;height:100%;object-fit:cover}@media(max-width:768px){.container{grid-template-columns:1fr}.detail-inner{grid-template-columns:1fr}}</style></head><body>
<header><div class="logo">SAMUNDRI<span>MARKET</span></div><button class="sell-btn" onclick="document.getElementById('sell').style.display='block'">+ SELL</button></header>
<div class="container"><div><div class="filters">Price <input id="minP" type="number" placeholder="Min" style="width:60px"> - <input id="maxP" type="number" placeholder="Max" style="width:60px"> Location <select id="locF"><option value="">All</option><option>Faisalabad</option><option>Samundri City</option><option>Tandlianwala</option></select> <button onclick="apply()" style="background:#002f34;color:#fff;padding:5px 10px;border:none;border-radius:4px">Filter</button> <span id="cnt"></span></div><div class="ads-grid" id="ads"></div></div><div><div class="filters"><h3>Sell Faster</h3><div style="border:1px solid #23e5db;padding:10px;border-radius:8px;margin:10px 0"><b>Basic Rs.299</b><br><small>Easypaisa 03430864009<br>Atiq ur Rehman</small></div><div style="border:1px solid #ffce32;padding:10px;border-radius:8px"><b>Premium Rs.599</b><br><small>Easypaisa 03430864009<br>Atiq ur Rehman</small></div><div style="margin-top:15px;font-size:12px"><b>My Ads:</b><div id="myAds"></div></div></div></div></div>
<div class="detail" id="detail"><div class="detail-inner"><div style="padding:10px"><img id="dMain" style="width:100%;height:380px;object-fit:contain;background:#000"><div id="dThumbs" style="display:flex;gap:6px;margin-top:8px;overflow:auto"></div><h3 id="dTitle" style="margin-top:10px"></h3><p id="dDesc" style="font-size:14px;margin-top:8px"></p></div><div style="padding:15px;border-left:1px solid #ddd"><h2 id="dPrice"></h2><p id="dLoc" style="color:#888;font-size:13px"></p><button style="width:100%;background:#002f34;color:#fff;padding:12px;margin-top:12px;border:none;border-radius:6px">Call</button><button style="width:100%;background:#25d366;color:#fff;padding:12px;margin-top:8px;border:none;border-radius:6px">WhatsApp</button><button onclick="document.getElementById('detail').style.display='none'" style="width:100%;margin-top:15px;padding:8px">Close</button></div></div></div>
<div class="sell-modal" id="sell"><div class="sell-box"><h2>Post Ad - Auto Live!</h2><input id="sT" placeholder="Title"><input id="sP" type="number" placeholder="Price Rs"><select id="sL"><option>Faisalabad</option><option>Samundri City</option><option>Tandlianwala</option></select><textarea id="sD" placeholder="Description"></textarea><b>5 Photos</b><div class="pic-box" id="pb"><div onclick="f1.click()">+<input type="file" id="f1" hidden accept="image/*" onchange="prev(this,0)"></div><div onclick="f2.click()">+<input type="file" id="f2" hidden accept="image/*" onchange="prev(this,1)"></div><div onclick="f3.click()">+<input type="file" id="f3" hidden accept="image/*" onchange="prev(this,2)"></div><div onclick="f4.click()">+<input type="file" id="f4" hidden accept="image/*" onchange="prev(this,3)"></div><div onclick="f5.click()">+<input type="file" id="f5" hidden accept="image/*" onchange="prev(this,4)"></div></div><button onclick="post()" style="width:100%;background:#002f34;color:#fff;padding:14px;border:none;border-radius:8px;margin-top:12px;font-weight:700">Post Now - Instant Live!</button><button onclick="document.getElementById('sell').style.display='none'" style="width:100%;margin-top:8px;padding:8px">Cancel</button><p style="color:green;font-size:12px;margin-top:8px">Auto-Approved - Foran Live Hoga!</p></div></div>
<script>
let def=[{id:1,title:"Honda CD 70 2023",price:125000,loc:"Faisalabad",imgs:["https://images.unsplash.com/photo-1558981403-c5f9899a28bc?w=400"],desc:"Good condition"},{id:2,title:"iPhone 13 PTA 256GB",price:185000,loc:"Faisalabad",imgs:["https://images.unsplash.com/photo-1592899677977-9bb10ba128a5?w=400"],desc:"10/10"},{id:3,title:"5 Marla House Samundri",price:5500000,loc:"Samundri City",imgs:["https://images.unsplash.com/photo-1600585154340-be6161a56a0c?w=400"],desc:"Gas Bijli"}];
let user=JSON.parse(localStorage.getItem('sm_ads')||'[]');let all=[...def,...user];let favs=JSON.parse(localStorage.getItem('favs')||'[]');let tmp=["","","","",""];
function render(l){let h='';l.forEach(a=>{h+=`<div class="card" onclick="openD(${a.id})"><img src="${a.imgs[0]}"><div class="card-body"><span class="heart ${favs.includes(a.id)?'fav':''}" onclick="event.stopPropagation();toggle(${a.id})">❤</span><div class="price">Rs ${a.price.toLocaleString()}</div><div class="title">${a.title}</div><div class="loc">${a.loc}</div></div></div>`});document.getElementById('ads').innerHTML=h;document.getElementById('cnt').innerText=l.length+' Ads';let mh='';user.forEach(a=>{mh+=`<div style="border-bottom:1px solid #eee;padding:4px 0">${a.title} <button onclick="del(${a.id})" style="float:right;color:red;border:none;background:none">X</button></div>`});document.getElementById('myAds').innerHTML=mh||'No ads';}
function toggle(id){if(favs.includes(id)) favs=favs.filter(x=>x!=id); else favs.push(id);localStorage.setItem('favs',JSON.stringify(favs));render(all);}
function openD(id){let a=all.find(x=>x.id==id);dMain.src=a.imgs[0];dTitle.innerText=a.title;dPrice.innerText='Rs '+a.price.toLocaleString();dLoc.innerText=a.loc;dDesc.innerText=a.desc;let th='';a.imgs.forEach(im=>{th+=`<img src="${im}" style="width:60px;height:50px;object-fit:cover;cursor:pointer" onclick="dMain.src='${im}'">`});dThumbs.innerHTML=th;detail.style.display='block';}
function apply(){let mn=parseInt(minP.value)||0;let mx=parseInt(maxP.value)||999999999;let lc=locF.value;let f=all.filter(a=>a.price>=mn&&a.price<=mx&&(!lc||a.loc==lc));render(f);}
function prev(inp,i){let r=new FileReader();r.onload=e=>{tmp[i]=e.target.result;pb.children[i].innerHTML=`<img src="${e.target.result}">`};r.readAsDataURL(inp.files[0]);}
function post(){let t=sT.value;let p=parseInt(sP.value);let l=sL.value;let d=sD.value;let im=tmp.filter(x=>x!='');if(!t||!p){alert('Title Price zaruri');return}if(im.length==0) im=["https://via.placeholder.com/400x300?text=Samundri+Market"];let na={id:Date.now(),title:t,price:p,loc:l,desc:d,imgs:im};user.unshift(na);localStorage.setItem('sm_ads',JSON.stringify(user));all=[...def,...user];tmp=["","","","",""];document.getElementById('sell').style.display='none';render(all);alert('Mubarak ho! Ad Live ho gaya - Auto Approved!');}
function del(id){user=user.filter(a=>a.id!=id);localStorage.setItem('sm_ads',JSON.stringify(user));all=[...def,...user];render(all);}render(all);
</script></body></html>
